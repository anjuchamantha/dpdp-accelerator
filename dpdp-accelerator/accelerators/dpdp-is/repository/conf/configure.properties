#
# Deployment settings consumed by bin/configure.sh.

# Hostname and port clients use to reach the Identity Server.
IS_HOSTNAME=localhost
IS_PORT=9443

# Identity Server administrator. Substituted into the shipped deployment.toml
# template only. It is never stored in the portal's runtime configuration.
IS_ADMIN_USERNAME=admin@wso2.com
IS_ADMIN_PASSWORD=wso2123

# The deployment.toml configure.sh installs. It is a complete file that REPLACES
# the one in the product, not a fragment merged into it. To support a different
# Identity Server version, add a template beside this one and point this at it.
PRODUCT_CONF_PATH=repository/resources/wso2is-7.3.0-deployment.toml

# Database type for both the Identity Server's own databases and the DPDP database
# (WSO2DPDP_DB) - kept as one setting since the two must be kept in sync.
# One of the types defined in dbprofiles.properties, currently: h2, mysql.
DB_TYPE=h2

# Connection settings for every DB_TYPE other than h2, which is embedded and ignores
# them. The account needs CREATE DATABASE rights on first run; afterwards, rights on
# the databases below are enough.
DB_HOST=localhost
# Leave blank to use the type's default port from dbprofiles.properties.
DB_PORT=
DB_USER=root
DB_PASS=root

# TLS for the JDBC connection, substituted into the URL as Connector/J's sslMode.
#   PREFERRED       encrypt if the server offers it, otherwise CONNECT IN PLAINTEXT
#   REQUIRED        encrypt or refuse to connect
#   VERIFY_CA       REQUIRED, and validate the server certificate against a truststore
#   VERIFY_IDENTITY VERIFY_CA, and check the hostname matches the certificate
# PREFERRED is Connector/J's own default and is what a MySQL with no TLS configured
# needs, so it is shipped here - but it falls back silently, so a deployment carrying
# personal data over a network should set REQUIRED or stronger. configure.sh says so at
# install time rather than leaving the fallback invisible.
# TEMPORARY - DIAGNOSTIC ONLY, REVERT BEFORE MERGE.
# Set to DISABLED to isolate whether the AGENT user store's connection failure in CI is
# caused by encrypting the connection at all, or by something else in this change.
# DISABLED is semantically what useSSL=false did, so this run exercises every line of the
# new code with the old wire behaviour. PREFERRED is the intended shipped value.
DB_SSL_MODE=DISABLED

# Database names. The defaults match the embedded H2 filenames so the two layouts
# line up; change them only if the server shares an instance with something else.
DB_IDENTITY=WSO2IDENTITY_DB
DB_SHARED=WSO2SHARED_DB
DB_AGENT_IDENTITY=WSO2AGENTIDENTITY_DB
DB_DPDP=WSO2DPDP_DB

# DESTRUCTIVE. Drops and recreates all four databases before applying any schema.
# Intended for a test run or a local reset. Left false, configure.sh never deletes
# data: it creates only databases that are missing, and applies the Identity Server's
# own (non-idempotent) schema only to databases it created in that same run.
RECREATE_DATABASES=false

# Adds IS's own consent-mgt v2 tables to WSO2IDENTITY_DB. Set to false if
# you've already applied it, or the database is managed elsewhere.
APPLY_IS_CONSENT_MGT_V2_MIGRATION=true

# Set false to skip the DPDP schema migration.
APPLY_DPDP_DB_MIGRATION=true
