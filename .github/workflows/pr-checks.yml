# Build + end-to-end checks for the DPDP accelerator. The E2E job itself lives in the
# reusable `e2e.yml`, shared with `release-builder.yml`.
#
# No ruleset yet marks these as required checks on main/dev (needs admin access) -
# `e2e-required` is red until that's set up, but doesn't currently block merge.
#
# `pull_request` -> `build` only (every PR, including forks, no secrets).
# `pull_request_target` -> `e2e`, gated behind the `Action/trigger-e2e` label, since E2E
# needs real WSO2 subscription credentials that pull_request never exposes to forks. A
# maintainer applies the label after reviewing the diff; `reset-e2e-label-on-push` clears
# it on every new commit so approval never carries over to unreviewed code.
# `workflow_dispatch` also runs `e2e` directly and is the only way to pick
# `is_source: release` (download + U2 update) instead of the default `master`
# (build from source). Default is `master` because release+U2 is currently blocked -
# the public release zip is missing `migration-resources/`. Flip back once fixed upstream.
name: PR checks

on:
  pull_request:
    branches: [main, dev]
  pull_request_target:
    branches: [main, dev]
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
    inputs:
      is_source:
        description: Where to get the Identity Server pack from
        type: choice
        options: [release, master]
        default: master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Build
        run: mvn -B clean install
        env:
          MAVEN_OPTS: -Xmx4g

  # Prevents a label approval on commit A from silently authorizing E2E on later commits.
  reset-e2e-label-on-push:
    name: Reset E2E label on push
    if: >
      github.event_name == 'pull_request_target' &&
      (github.event.action == 'synchronize' || github.event.action == 'reopened')
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Remove stale Action/trigger-e2e label
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          error_output=$(gh api "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/labels/Action%2Ftrigger-e2e" \
            -X DELETE 2>&1)
          exit_code=$?
          set -e
          if [ $exit_code -ne 0 ] && ! echo "$error_output" | grep -qi "404\|not found"; then
            echo "$error_output" >&2
            exit $exit_code
          fi

  # Pins the checkout to the PR's head SHA (pull_request_target otherwise checks out the
  # target branch); allow_unsafe_pr_checkout permits fetching fork code, safe here because
  # this only runs after a maintainer applies the reviewed Action/trigger-e2e label.
  e2e:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request_target' &&
       github.event.action == 'labeled' &&
       github.event.label.name == 'Action/trigger-e2e')
    uses: ./.github/workflows/e2e.yml
    with:
      ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || '' }}
      is_source: ${{ github.event_name == 'workflow_dispatch' && inputs.is_source || 'master' }}
      allow_unsafe_pr_checkout: ${{ github.event_name == 'pull_request_target' }}
    secrets: inherit

  # `e2e` can't be the required check itself: GitHub treats a job skipped by its own
  # `if:` as satisfying a required check, so an unlabeled PR would merge unchecked.
  # This job always runs on pull_request_target and fails unless `e2e` succeeded - it's
  # the one to select as the required status check in Settings -> Rules -> Rulesets.
  e2e-required:
    name: E2E integration tests (required)
    if: always() && github.event_name == 'pull_request_target'
    needs: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check E2E actually ran and passed
        run: |
          if [ "${{ needs.e2e.result }}" != "success" ]; then
            echo "::error::E2E has not passed on this commit (status: ${{ needs.e2e.result }})." \
                 "Apply the 'Action/trigger-e2e' label to run it - a maintainer must do this" \
                 "after reviewing the diff, since it runs with real WSO2 subscription credentials." \
                 "The label is removed automatically on every new push, so it must be re-applied" \
                 "after each commit."
            exit 1
          fi
          echo "E2E passed."
