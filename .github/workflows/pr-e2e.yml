# The secret-bearing E2E path. Triggers:
#
#   - pull_request_target [labeled]: runs only once a maintainer applies
#     Action/trigger-e2e, having reviewed the diff. That review is what makes it
#     acceptable to run possibly-fork-supplied code with real WSO2 subscription
#     credentials, which plain `pull_request` never exposes to a fork.
#     pr-e2e-gate.yml strips the label on every subsequent push, so an approval
#     cannot carry over to code nobody looked at.
#   - workflow_dispatch: manual and already authenticated, so no label needed.
#     It is also the only way to pick `is_source: release` (a GA pack plus U2
#     updates); labelled PR runs always build product-is from master, which
#     needs no subscription secrets at all.
#
# E2E checks out refs/pull/N/merge - the PR merged onto the current base - not
# the branch tip, so it tests what merging would actually produce rather than
# code that may be green only in isolation. e2e.yml additionally verifies that
# merge ref still carries the head commit the label authorised.
name: PR E2E

on:
  pull_request_target:
    branches: [main, dev]
    types: [labeled]
  workflow_dispatch:
    inputs:
      is_source:
        description: Where to get the Identity Server pack from
        type: choice
        options: [release, master]
        default: release

# Must stay identical to pr-e2e-gate.yml's group so a new push cancels an E2E
# run already in flight against the commit it supersedes.
concurrency:
  group: pr-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    # Guard on the label's name: applying any other label fires `labeled` too.
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.label.name == 'Action/trigger-e2e'
    uses: ./.github/workflows/e2e.yml
    with:
      ref: ${{ github.event_name == 'pull_request_target' && format('refs/pull/{0}/merge', github.event.pull_request.number) || '' }}
      expected_head_sha: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || '' }}
      is_source: ${{ github.event_name == 'workflow_dispatch' && inputs.is_source || 'master' }}
      allow_unsafe_pr_checkout: ${{ github.event_name == 'pull_request_target' }}
    secrets: inherit

  # Flips the "E2E gate" status pr-e2e-gate.yml set to pending. Skipped when the
  # run was cancelled, because that only happens when a newer push has already
  # re-pended the gate on its own head commit - writing to the superseded SHA
  # would just be noise.
  report:
    name: Report E2E gate
    needs: e2e
    if: >
      always() && github.event_name == 'pull_request_target' &&
      github.event.label.name == 'Action/trigger-e2e' &&
      needs.e2e.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      statuses: write
    steps:
      - name: Set the E2E gate status
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ needs.e2e.result }}
        run: |
          if [ "$RESULT" = "success" ]; then
            state=success
            description="E2E passed"
          else
            state=failure
            description="E2E result: $RESULT - see the run for details"
          fi
          gh api "repos/${{ github.repository }}/statuses/${{ github.event.pull_request.head.sha }}" \
            -f state="$state" \
            -f context="E2E gate" \
            -f description="$description" \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
